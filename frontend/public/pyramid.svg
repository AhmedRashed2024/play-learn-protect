<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="pyramidGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#D4AF37"/>
      <stop offset="100%" style="stop-color:#B8860B"/>
    </linearGradient>
    <linearGradient id="pyramidShadow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#8B7355"/>
      <stop offset="100%" style="stop-color:#D4AF37"/>
    </linearGradient>
  </defs>
  <!-- Main pyramid face -->
  <polygon points="50,10 90,80 10,80" fill="url(#pyramidGrad)"/>
  <!-- Shadow side -->
  <polygon points="50,10 90,80 70,80" fill="url(#pyramidShadow)" opacity="0.5"/>
  <!-- Sun -->
  <circle cx="75" cy="25" r="10" fill="#F4D03F"/>
</svg>
